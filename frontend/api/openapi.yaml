        scheduleEnabled:
          type: boolean
          description: Master switch for the weekly cleaning schedule
        autoRestartEnabled:
          type: boolean
          description: Restart the robot once per day at the configured local time when idle
        autoRestartHour:
          type: number
          description: Hour for the daily maintenance restart in local time (0-23)
        autoRestartMinute:
          type: number
          description: Minute for the daily maintenance restart in local time (0-59)
        restartBeforeClean:
