openapi: 3.0.3
info:
  title: OpenNeato API
  version: 0.0.0-dev
  description: HTTP API exposed by the OpenNeato firmware. All endpoints are served on the local network only (no authentication, no TLS). The diagnostic `/api/serial` passthrough is documented separately in the [user guide](https://github.com/renjfk/OpenNeato/blob/main/docs/user-guide.md#serial-api).
servers:
  - url: http://{host}
    description: OpenNeato bridge on local network
    variables:
      host:
        default: neato.local
tags:
  - name: Sensors
    description: Read-only telemetry from the robot
  - name: Actions
    description: Control commands sent to the robot
  - name: Manual
    description: Manual cleaning mode (joystick, motors)
  - name: Logs
    description: Diagnostic log files stored in flash
  - name: WiFi
    description: WiFi station status and provisioning over the fallback AP
  - name: System
    description: ESP32 system health and lifecycle
  - name: Settings
    description: User-configurable bridge settings
  - name: Firmware
    description: ESP32 firmware version and OTA update
  - name: History
    description: Cleaning session history and map data
  - name: Guided
    description: Floor map (pinned session, rooms, no-go zones) and ESP32-driven room cleaning
paths:
  /api/version:
    get:
      tags:
        - Sensors
      summary: Get robot identity (model, serial, firmware versions)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/charger:
    get:
      tags:
        - Sensors
      summary: Get battery and charger status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChargerData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/analog:
    get:
      tags:
        - Sensors
      summary: Get battery-related analog readings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryAnalogData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/warranty:
    get:
      tags:
        - Sensors
      summary: Get battery cycle and lifetime counters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatteryWarrantyData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/battery/new:
    post:
      tags:
        - Actions
      summary: Tell the robot a new battery has been installed (handles TestMode sequence internally)
      responses:
        "200":
          description: Success acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ok"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/motors:
    get:
      tags:
        - Sensors
      summary: Get motor telemetry (brush, vacuum, wheels, side brush, laser)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotorData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/state:
    get:
      tags:
        - Sensors
      summary: Get current UI and robot state machine values
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/error:
    get:
      tags:
        - Sensors
      summary: Get current error or warning state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lidar:
    get:
      tags:
        - Sensors
      summary: Get latest 360-point LIDAR scan
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarScan"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/user-settings:
    get:
      tags:
        - Sensors
      summary: Get robot on-board user settings (sounds, eco, wall follow, maintenance)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettingsData"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags:
        - Actions
      summary: Set a single robot on-board user setting
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
        - name: value
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/clean:
    post:
      tags:
        - Actions
      summary: Start, pause, resume, stop, or dock cleaning
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - house
              - spot
              - pause
              - stop
              - dock
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/sound:
    post:
      tags:
        - Actions
      summary: Play a robot sound effect
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 20
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/power:
    post:
      tags:
        - Actions
      summary: Restart or shutdown the robot
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - restart
              - shutdown
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/lidar/rotate:
    post:
      tags:
        - Actions
      summary: Start or stop LIDAR turret rotation
      parameters:
        - name: enable
          in: query
          required: true
          schema:
            type: boolean
            minimum: 0
            maximum: 1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/clear-errors:
    post:
      tags:
        - Actions
      summary: Clear all UI errors and warnings on the robot
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: robot busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/schedule/next:
    get:
      tags:
        - Actions
      summary: Get the next scheduled cleaning slot and skip state
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleNextData"
    post:
      tags:
        - Actions
      summary: Skip the next enabled scheduled cleaning slot
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    delete:
      tags:
        - Actions
      summary: Cancel the pending skip for the next scheduled cleaning slot
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/manual/status:
    get:
      tags:
        - Manual
      summary: Get manual mode state (active flag, motors, bumpers, stalls)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualStatus"
  /api/manual/move:
    post:
      tags:
        - Manual
      summary: Drive the wheels for a specific distance at a given speed
      parameters:
        - name: left
          in: query
          required: true
          description: mm, negative=backward
          schema:
            type: integer
        - name: right
          in: query
          required: true
          description: mm, negative=backward
          schema:
            type: integer
        - name: speed
          in: query
          required: true
          description: mm/s
          schema:
            type: integer
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: manual mode inactive or unsafe state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/manual/motors:
    post:
      tags:
        - Manual
      summary: Toggle main brush, vacuum, and side brush motors
      parameters:
        - name: brush
          in: query
          required: true
          schema:
            type: boolean
            minimum: 0
            maximum: 1
        - name: vacuum
          in: query
          required: true
          schema:
            type: boolean
            minimum: 0
            maximum: 1
        - name: sideBrush
          in: query
          required: true
          schema:
            type: boolean
            minimum: 0
            maximum: 1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: manual mode inactive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/manual:
    post:
      tags:
        - Manual
      summary: Enable or disable manual mode (also enters TestMode and starts LIDAR)
      parameters:
        - name: enable
          in: query
          required: true
          schema:
            type: boolean
            minimum: 0
            maximum: 1
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "503":
          description: cannot enter manual mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "504":
          description: robot timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/logs:
    get:
      tags:
        - Logs
      summary: List all log files
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogFileInfo"
    delete:
      tags:
        - Logs
      summary: Delete all log files
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/logs/{filename}:
    get:
      tags:
        - Logs
      summary: Download a single log file (transparently decompressed)
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: application/x-ndjson
          content:
            application/x-ndjson:
              schema:
                type: string
        "404":
          description: log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Logs
      summary: Delete a single log file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          description: log not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/wifi/status:
    get:
      tags:
        - WiFi
      summary: Get current WiFi STA + fallback AP status snapshot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiFiStatus"
  /api/wifi/scan:
    get:
      tags:
        - WiFi
      summary: Scan for nearby WiFi networks (synchronous, capped at 30 entries)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WiFiScanResult"
        "500":
          description: scan failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/wifi/connect:
    post:
      tags:
        - WiFi
      summary: Save credentials and connect to a WiFi network (reboots on success)
      parameters:
        - name: ssid
          in: query
          required: true
          schema:
            type: string
        - name: password
          in: query
          required: true
          description: Empty string for open networks
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: missing ssid or connection failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/wifi/disconnect:
    post:
      tags:
        - WiFi
      summary: Clear saved credentials and drop the STA connection
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/system:
    get:
      tags:
        - System
      summary: Get live system metrics (heap, uptime, WiFi RSSI, storage, NTP, time)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemData"
  /api/system/restart:
    post:
      tags:
        - System
      summary: Restart the ESP32 (deferred 500ms to flush HTTP response)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/system/reset:
    post:
      tags:
        - System
      summary: Factory reset (clear NVS and WiFi credentials, then restart)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/system/format-fs:
    post:
      tags:
        - System
      summary: Format the SPIFFS filesystem (erases logs and history, then restart)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/settings:
    get:
      tags:
        - Settings
      summary: Get all bridge settings (timezone, logging, WiFi, navigation, schedule, notifications)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsData"
    put:
      tags:
        - Settings
      summary: Partial settings update (only fields present in body are written)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsData"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsData"
        "400":
          description: invalid settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/notifications/test:
    post:
      tags:
        - Settings
      summary: Send a test push notification to the given ntfy.sh topic
      parameters:
        - name: topic
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: missing or empty topic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/firmware/version:
    get:
      tags:
        - Firmware
      summary: Get current ESP32 firmware version, chip model, robot model, and support status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwareVersion"
  /api/firmware/update:
    post:
      tags:
        - Firmware
      summary: Upload a new firmware image and verify against the supplied MD5
      parameters:
        - name: hash
          in: query
          required: true
          description: MD5 of firmware binary
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: text/plain "OK"
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: update failed (bad hash, write error, or MD5 mismatch)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/history:
    get:
      tags:
        - History
      summary: List all cleaning session files with embedded session and summary metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HistoryFileInfo"
    delete:
      tags:
        - History
      summary: Delete all cleaning session files
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/history/{filename}:
    get:
      tags:
        - History
      summary: Download a single session file (transparently decompressed)
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: application/x-ndjson
          content:
            application/x-ndjson:
              schema:
                type: string
        "404":
          description: session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - History
      summary: Delete a single cleaning session file
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          description: session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/history/import:
    post:
      tags:
        - History
      summary: Upload a JSONL session file (compressed and stored on flash)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: import failed (invalid file or write error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/floormap:
    get:
      tags:
        - Guided
      summary: Download the stored floor map document
      description: |
        Line-based text format "OFM1" (one record per line, points as integer millimetres "x,y"
        in the frame of the pinned session, dock = origin):

        ```
        OFM1
        S <source session filename>
        P x,y x,y ...                      path points (repeatable, order kept)
        R <id> <percent-encoded name> x,y ...  room polygon
        N <id> x,y ...                     no-go polygon
        ```
      responses:
        "200":
          description: Floor map document
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: no floor map stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      tags:
        - Guided
      summary: Replace the floor map (validated before it replaces the current one)
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: invalid document (bad header, malformed points, too many zones)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: document larger than 64 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Guided
      summary: Delete the floor map
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "404":
          description: no floor map stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: guided clean is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/floormap/field:
    get:
      tags:
        - Guided
      summary: Download the localization field built from a mapping run
      description: |
        Binary, little endian: "OFL1", int32 originX mm, int32 originY mm, uint16 cell mm,
        uint16 w, uint16 h, int8 lidarSign, int8 reserved, int16 lidarAngleOffset (0.1°),
        int16 lidarOffsetX mm, int16 reserved, then w*h bytes (row-major, y up; 255 = wall).
      responses:
        "200":
          description: Localization field
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: no localization field stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Guided
      summary: Delete the LIDAR localization field (the pinned run has no scans)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
    put:
      tags:
        - Guided
      summary: Replace the localization field (validated before it replaces the current one)
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: invalid field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: field larger than 96 KB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/floormap/record:
    post:
      tags:
        - Guided
      summary: Start a mapping run (house clean that also records LIDAR scans)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "409":
          description: robot busy (guided or manual mode)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: robot not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/diag:
    get:
      tags:
        - System
      summary: Robot identification and serial link diagnostics (always collected)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagData"
  /api/diag/identify:
    post:
      tags:
        - System
      summary: Retry robot identification immediately (resets the retry backoff)
      responses:
        "200":
          $ref: "#/components/responses/Ok"
  /api/guided/trace:
    get:
      tags:
        - Guided
      summary: Trace of the last guided clean (JSON lines - pose, localization fixes, events)
      responses:
        "200":
          description: One JSON object per line
          content:
            application/x-ndjson:
              schema:
                type: string
        "404":
          description: no guided clean recorded yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/guided/status:
    get:
      tags:
        - Guided
      summary: Guided clean progress, live pose estimate and last result
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuidedStatus"
  /api/guided:
    post:
      tags:
        - Guided
      summary: Start, stop or recall a guided (room) clean
      description: |
        `start` requires the robot to be idle on its dock (the dock is the map origin).
        The ESP32 drives the robot in TestMode along the pinned path inside the selected
        rooms, skipping no-go zones, then returns it to the dock.
      parameters:
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - start
              - home
              - stop
        - name: rooms
          in: query
          required: false
          description: Comma-separated room ids for `start` (empty = all rooms)
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Ok"
        "400":
          description: missing or unknown action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: request not possible right now (reason in `error`, e.g. no map, already running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    DiagData:
      type: object
      required: [identify, serial, link, history, esp]
      properties:
        identify:
          type: object
          required: [pending, hasSKey, model, attempts, lastAttemptAgoS, identifiedAgoS, nextRetryInS, inFlight, lastError, lastRaw]
          properties:
            pending: { type: boolean, description: Robot not identified yet }
            hasSKey: { type: boolean }
            model: { type: string }
            attempts: { type: integer }
            lastAttemptAgoS: { type: integer, description: Seconds since the last attempt (-1 = never) }
            identifiedAgoS: { type: integer, description: Seconds since identification (-1 = never) }
            nextRetryInS: { type: integer }
            inFlight: { type: boolean, description: An attempt is waiting for its answer }
            lastError: { type: string }
            lastRaw: { type: string, description: Start of the last GetVersion answer }
        serial:
          type: object
          required: [queueDepth, state, current, ok, timeouts, desyncs, unsupported, queueFull, rxBytes, lastRxAgoS, lastOkAgoS, lastFailCmd, lastFailStatus, lastFailAgoS, lastFailPartial]
          properties:
            queueDepth: { type: integer }
            state: { type: string }
            current: { type: string }
            ok: { type: integer }
            timeouts: { type: integer }
            desyncs: { type: integer }
            unsupported: { type: integer }
            queueFull: { type: integer }
            rxBytes: { type: integer, description: Bytes received from the robot since boot }
            lastRxAgoS: { type: integer }
            lastOkAgoS: { type: integer }
            lastFailCmd: { type: string }
            lastFailStatus: { type: string }
            lastFailAgoS: { type: integer }
            lastFailPartial: { type: string }
        link:
          type: object
          description: UART link state - tells a silent robot from a dead or noisy line
          required: [txPin, rxPin, baud, rxLevel, rxIdleLowPct, uartBreaks, uartFrameErrors, uartOverflows, staleBytes, rawTail]
          properties:
            txPin: { type: integer }
            rxPin: { type: integer }
            baud: { type: integer }
            rxLevel: { type: integer, description: RX pin level right now (1 = idle high; the pin has its pull-up on) }
            rxIdleLowPct: { type: integer, description: Share of idle samples with RX low in the last 10 s window (-1 = no window yet) }
            uartBreaks: { type: integer, description: Break events - RX held low (robot TX off or no contact) }
            uartFrameErrors: { type: integer, description: "Frame or parity errors: noise, floating line or wrong baud" }
            uartOverflows: { type: integer }
            staleBytes: { type: integer, description: Bytes that arrived outside a command }
            rawTail: { type: string, description: "Last bytes received; CR, LF, Ctrl-Z and other control bytes escaped" }
        history:
          type: array
          description: Last serial commands, oldest first
          items:
            $ref: "#/components/schemas/DiagCommand"
        esp:
          type: object
          required: [uptimeS, resetReason, freeHeap, minFreeHeap, maxAllocHeap]
          properties:
            uptimeS: { type: integer }
            resetReason: { type: integer, description: esp_reset_reason() code }
            freeHeap: { type: integer }
            minFreeHeap: { type: integer }
            maxAllocHeap: { type: integer }
    DiagCommand:
      type: object
      required: [cmd, status, ms, bytes, agoS]
      properties:
        cmd: { type: string, description: Command (SKey redacted) }
        status: { type: string, enum: [ok, timeout, desync, unsupported, queueFull, error] }
        ms: { type: integer }
        bytes: { type: integer, description: Response bytes }
        agoS: { type: integer }
    Ok:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    ScheduleNextData:
      type: object
      properties:
        enabled:
          type: boolean
          description: Whether the weekly cleaning schedule is enabled
        skipNextClean:
          type: boolean
          description: Whether the next enabled scheduled cleaning slot will be skipped
        next:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ScheduleTime"
      required:
        - enabled
        - skipNextClean
        - next
    ScheduleTime:
      type: object
      properties:
        day:
          type: string
          enum:
            - Mon
            - Tue
            - Wed
            - Thu
            - Fri
            - Sat
            - Sun
        dayOffset:
          type: integer
          description: Days from the current local day (0 = today)
        hour:
          type: integer
          minimum: 0
          maximum: 23
        minute:
          type: integer
          minimum: 0
          maximum: 59
      required:
        - day
        - dayOffset
        - hour
        - minute
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    VersionData:
      type: object
      properties:
        modelName:
          type: string
          description: Robot model name (e.g. "Botvac D7")
        serialNumber:
          type: string
          description: Robot serial number
        softwareVersion:
          type: string
          description: Robot firmware version, format "Major.Minor.Build"
        ldsVersion:
          type: string
          description: LIDAR firmware version
        ldsSerial:
          type: string
          description: LIDAR serial number
        mainBoardVersion:
          type: string
          description: Main board hardware version
        smartBatteryAuthorization:
          type: number
          description: Smart battery authorization status reported by the robot
        smartBatteryDataVersion:
          type: number
          description: Smart battery data block version
        smartBatteryChemistry:
          type: string
          description: Battery chemistry, e.g. LION1
        smartBatteryDeviceName:
          type: string
          description: Smart battery device name
        smartBatteryManufacturerName:
          type: string
          description: Smart battery manufacturer name
        smartBatteryMfgDate:
          type: string
          description: Smart battery manufacturing date as reported by the robot
        smartBatterySerialNumber:
          type: string
          description: Smart battery serial number
        smartBatterySoftwareVersion:
          type: string
          description: Smart battery controller software version
      required:
        - modelName
        - serialNumber
        - softwareVersion
        - ldsVersion
        - ldsSerial
        - mainBoardVersion
    ChargerData:
      type: object
      properties:
        fuelPercent:
          type: number
          description: Battery charge percentage (0-100, -1 = unknown)
        batteryOverTemp:
          type: boolean
          description: Battery temperature exceeds safe limits
        chargingActive:
          type: boolean
          description: Charger currently delivering current
        chargingEnabled:
          type: boolean
          description: Charging circuit enabled (independent of active flow)
        confidOnFuel:
          type: boolean
          description: Fuel gauge reading is trusted
        onReservedFuel:
          type: boolean
          description: Battery has dropped into reserve range
        emptyFuel:
          type: boolean
          description: Battery considered empty (robot will not start)
        batteryFailure:
          type: boolean
          description: Battery hardware fault detected
        extPwrPresent:
          type: boolean
          description: External power supply (dock or barrel jack) connected
        vBattV:
          type: number
          description: Battery voltage in volts
        vExtV:
          type: number
          description: External supply voltage in volts
        chargerMAH:
          type: number
          description: Cumulative mAh delivered into the battery
        dischargeMAH:
          type: number
          description: Cumulative mAh discharged from the battery
      required:
        - fuelPercent
        - batteryOverTemp
        - chargingActive
        - chargingEnabled
        - confidOnFuel
        - onReservedFuel
        - emptyFuel
        - batteryFailure
        - extPwrPresent
        - vBattV
        - vExtV
        - chargerMAH
        - dischargeMAH
    BatteryAnalogData:
      type: object
      properties:
        batteryVoltageV:
          type: number
          description: Battery pack voltage in volts from GetAnalogSensors
        batteryCurrentMA:
          type: number
          description: Live battery current in mA from GetAnalogSensors
        batteryTemperatureC:
          type: number
          description: Battery temperature in Celsius from GetAnalogSensors
        externalVoltageV:
          type: number
          description: External supply voltage in volts from GetAnalogSensors
      required:
        - batteryVoltageV
        - batteryCurrentMA
        - batteryTemperatureC
        - externalVoltageV
    BatteryWarrantyData:
      type: object
      properties:
        cumulativeBatteryCycles:
          type: number
          description: Lifetime battery cycles decoded from GetWarranty
        cumulativeCleaningTimeSeconds:
          type: number
          description: Lifetime cleaning time decoded from GetWarranty
        validationCode:
          type: string
          description: Validation code reported by GetWarranty
      required:
        - cumulativeBatteryCycles
        - cumulativeCleaningTimeSeconds
        - validationCode
    MotorData:
      type: object
      properties:
        brushRPM:
          type: number
          description: Main brush rotation speed in RPM
        brushMA:
          type: number
          description: Main brush current draw in mA
        vacuumRPM:
          type: number
          description: Vacuum motor speed in RPM
        vacuumMA:
          type: number
          description: Vacuum motor current draw in mA
        leftWheelRPM:
          type: number
          description: Left wheel rotation speed in RPM
        leftWheelLoad:
          type: number
          description: Left wheel load percentage
        leftWheelPositionMM:
          type: number
          description: Left wheel position in millimeters since boot
        leftWheelSpeed:
          type: number
          description: Left wheel speed in mm/s
        rightWheelRPM:
          type: number
          description: Right wheel rotation speed in RPM
        rightWheelLoad:
          type: number
          description: Right wheel load percentage
        rightWheelPositionMM:
          type: number
          description: Right wheel position in millimeters since boot
        rightWheelSpeed:
          type: number
          description: Right wheel speed in mm/s
        sideBrushMA:
          type: number
          description: Side brush current draw in mA
        laserRPM:
          type: number
          description: Laser turret rotation speed in RPM
      required:
        - brushRPM
        - brushMA
        - vacuumRPM
        - vacuumMA
        - leftWheelRPM
        - leftWheelLoad
        - leftWheelPositionMM
        - leftWheelSpeed
        - rightWheelRPM
        - rightWheelLoad
        - rightWheelPositionMM
        - rightWheelSpeed
        - sideBrushMA
        - laserRPM
    StateData:
      type: object
      properties:
        uiState:
          type: string
          description: UI state machine value, e.g. "UIMGR_STATE_STANDBY"
        robotState:
          type: string
          description: Robot state machine value, e.g. "ST_C_Standby"
      required:
        - uiState
        - robotState
    ErrorData:
      type: object
      properties:
        hasError:
          type: boolean
          description: True if the robot is currently reporting an error or warning
        kind:
          type: string
          enum:
            - error
            - warning
          description: '"error" for codes 243+, "warning" for codes 201-242'
        errorCode:
          type: number
          description: Numeric error/warning code (200 = no error)
        errorMessage:
          type: string
          description: Full raw response from the robot (for diagnostics)
        displayMessage:
          type: string
          description: Human-readable message suitable for UI and notifications
      required:
        - hasError
        - kind
        - errorCode
        - errorMessage
        - displayMessage
    LidarScan:
      type: object
      properties:
        rotationSpeed:
          type: number
          description: LIDAR turret rotation speed in Hz
        validPoints:
          type: number
          description: Count of points with error == 0
        points:
          type: array
          items:
            $ref: "#/components/schemas/LidarPoint"
          description: Always 360 entries indexed by angle
      required:
        - rotationSpeed
        - validPoints
        - points
    LidarPoint:
      type: object
      properties:
        angle:
          type: number
          description: Bearing in degrees (0-359, 0 = robot front)
        dist:
          type: number
          description: Distance to target in millimeters (0 if invalid)
        intensity:
          type: number
          description: Return signal strength (0-255)
        error:
          type: number
          description: Per-point error code (0 = valid)
      required:
        - angle
        - dist
        - intensity
        - error
    UserSettingsData:
      type: object
      properties:
        buttonClick:
          type: boolean
          description: Play a click sound on button presses
        melodies:
          type: boolean
          description: Play melodies (start, finish, etc.)
        warnings:
          type: boolean
          description: Play warning chimes
        ecoMode:
          type: boolean
          description: Reduced power cleaning (longer runtime, lower suction)
        intenseClean:
          type: boolean
          description: Maximum power cleaning
        binFullDetect:
          type: boolean
          description: Stop and warn when dirt bin is full
        wallEnable:
          type: boolean
          description: Enable wall following along walls and edges
        wifi:
          type: boolean
          description: Robot WiFi radio enabled (separate from bridge WiFi)
        stealthLed:
          type: boolean
          description: Dim status LEDs at night
        filterChange:
          type: number
          description: Filter change reminder interval in seconds
        brushChange:
          type: number
          description: Brush change reminder interval in seconds
        dirtBin:
          type: number
          description: Dirt bin reminder interval in minutes
      required:
        - buttonClick
        - melodies
        - warnings
        - ecoMode
        - intenseClean
        - binFullDetect
        - wallEnable
        - wifi
        - stealthLed
        - filterChange
        - brushChange
        - dirtBin
    GuidedStatus:
      type: object
      properties:
        phase:
          type: string
          enum:
            - idle
            - starting
            - localizing
            - running
            - returning
            - docking
            - finishing
            - done
            - stopped
            - failed
        active:
          type: boolean
          description: A run is in progress (starting..finishing)
        hasMap:
          type: boolean
          description: A floor map is stored
        locMap:
          type: string
          enum: [none, ready, failed]
          description: LIDAR wall map for localization - none stored, ready, or stored but not loadable (memory)
        rooms:
          type: string
          description: Room ids requested for the current/last run ("" = all)
        x:
          type: number
          description: Pose estimate in metres (map frame)
        y:
          type: number
        t:
          type: number
          description: Heading estimate in degrees (0 = dock heading, counter-clockwise)
        progress:
          type: integer
          description: Processed clean waypoints in percent
        cleanDone:
          type: integer
        cleanTotal:
          type: integer
        obstacles:
          type: integer
          description: Bumps, stalls and cliffs handled during the run
        cleaning:
          type: boolean
          description: Brush and vacuum currently on
        elapsed:
          type: integer
          description: Seconds since start (frozen when the run ends)
        startedAt:
          type: integer
          description: Unix time of the last start (0 if unknown)
        message:
          type: string
          description: Failure reason, or why the robot returned early (empty on success)
        unreached:
          type: string
          description: Selected room ids the run never got into (closed door, blocked doorway), comma-separated; set once the run is returning
        compass:
          type: string
          enum:
            - "off"
            - pending
            - reference
            - locked
          description: LIDAR wall-compass state used to correct heading drift
        compassFixes:
          type: integer
        localization:
          type: string
          enum:
            - map
            - compass
            - odometry
          description: How the pose is corrected - LIDAR map matching, wall compass, or not at all
        locFixes:
          type: integer
          description: Accepted map matches during this run
        locScore:
          type: number
          description: Last map match score (0..1)
        locSpread:
          type: integer
          description: Particle filter position spread (1 sigma, mm)
        waiting:
          type: string
          description: What the controller is currently waiting for ("" = nothing)
        targetX:
          type: number
          description: Current target waypoint (only while active)
        targetY:
          type: number
      required:
        - phase
        - active
        - hasMap
        - rooms
        - x
        - y
        - t
        - progress
        - cleanDone
        - cleanTotal
        - obstacles
        - cleaning
        - elapsed
        - startedAt
        - message
        - compass
        - compassFixes
        - localization
        - locFixes
        - locScore
    ManualStatus:
      type: object
      properties:
        active:
          type: boolean
          description: Manual mode currently engaged
        brush:
          type: boolean
          description: Main brush motor enabled
        vacuum:
          type: boolean
          description: Vacuum motor enabled
        sideBrush:
          type: boolean
          description: Side brush motor enabled
        lifted:
          type: boolean
          description: Robot wheel-drop sensor reports the robot is off the ground
        bumperFrontLeft:
          type: boolean
          description: Front-left bumper contacted
        bumperFrontRight:
          type: boolean
          description: Front-right bumper contacted
        bumperSideLeft:
          type: boolean
          description: Left side bumper contacted
        bumperSideRight:
          type: boolean
          description: Right side bumper contacted
        stallFront:
          type: boolean
          description: Front wheel stall detected
        stallRear:
          type: boolean
          description: Rear wheel stall detected
      required:
        - active
        - brush
        - vacuum
        - sideBrush
        - lifted
        - bumperFrontLeft
        - bumperFrontRight
        - bumperSideLeft
        - bumperSideRight
        - stallFront
        - stallRear
    LogFileInfo:
      type: object
      properties:
        name:
          type: string
          description: File name as stored on flash (may include .hs compression suffix)
        size:
          type: number
          description: File size in bytes
        compressed:
          type: boolean
          description: True if stored with heatshrink compression
      required:
        - name
        - size
        - compressed
    SystemData:
      type: object
      properties:
        heap:
          type: number
          description: Free heap memory in bytes
        heapTotal:
          type: number
          description: Total heap memory in bytes
        uptime:
          type: number
          description: Milliseconds since boot
        rssi:
          type: number
          description: WiFi signal strength in dBm (negative, closer to 0 = stronger)
        fsUsed:
          type: number
          description: SPIFFS bytes used
        fsTotal:
          type: number
          description: SPIFFS total capacity in bytes
        ntpSynced:
          type: boolean
          description: NTP has successfully synced at least once
        time:
          type: number
          description: Current Unix epoch time in seconds (UTC)
        timeSource:
          type: string
          description: 'Time source: "ntp", "robot", or "boot"'
        tz:
          type: string
          description: Configured IANA timezone (e.g. "America/New_York")
        localTime:
          type: string
          description: DST-aware local time, e.g. "Sat 17:45:01"
        isDst:
          type: boolean
          description: True when daylight saving time is active
      required:
        - heap
        - heapTotal
        - uptime
        - rssi
        - fsUsed
        - fsTotal
        - ntpSynced
        - time
        - timeSource
        - tz
        - localTime
        - isDst
    SettingsData:
      type: object
      properties:
        tz:
          type: string
          description: IANA timezone identifier (e.g. "America/New_York")
        logLevel:
          type: number
          description: 0=off, 1=info, 2=debug
        apFallbackOnDisconnect:
          type: boolean
          description: Bring up the fallback AP automatically when STA drops
        syslogEnabled:
          type: boolean
          description: When on, logs go to UDP syslog instead of flash
        syslogIp:
          type: string
          description: IPv4 address of syslog receiver
        wifiTxPower:
          type: number
          description: WiFi TX power in 0.25 dBm units (e.g. 34 = 8.5 dBm)
        uartTxPin:
          type: number
          description: GPIO pin used for UART TX to the robot
        uartRxPin:
          type: number
          description: GPIO pin used for UART RX from the robot
        maxGpioPin:
          type: number
          description: Read-only - max valid GPIO for this chip (21 for C3, 39 for ESP32)
        hostname:
          type: string
          description: mDNS hostname (e.g. "openneato")
        navMode:
          type: string
          description: 'Navigation mode for house cleaning: "Normal", "Gentle", "Deep", "Quick"'
        stallThreshold:
          type: number
          description: Wheel load % for stall detection (30-80)
        brushRpm:
          type: number
          description: Main brush RPM (500-1600)
        vacuumSpeed:
          type: number
          description: Vacuum speed % (40-100)
        sideBrushPower:
          type: number
          description: Side brush power in mW (500-1500)
        ntfyTopic:
          type: string
          description: ntfy.sh topic for push notifications (empty = disabled)
        ntfyEnabled:
          type: boolean
          description: Global switch - must be on for any notification to fire
        ntfyOnDone:
          type: boolean
          description: Notify when cleaning completes
        ntfyOnError:
          type: boolean
          description: Notify on robot error (UI_ERROR_*, code 243+)
        ntfyOnAlert:
          type: boolean
          description: Notify on robot alert (UI_ALERT_*, code 201-242)
        ntfyOnDocking:
          type: boolean
