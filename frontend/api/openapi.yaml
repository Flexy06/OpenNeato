        sched3Hour:
          type: number
        sched3Min:
          type: number
        sched3On:
          type: boolean
        sched4Hour:
          type: number
        sched4Min:
          type: number
        sched4On:
          type: boolean
        sched5Hour:
          type: number
        sched5Min:
          type: number
        sched5On:
          type: boolean
        sched6Hour:
          type: number
        sched6Min:
          type: number
        sched6On:
          type: boolean
        sched0Slot1Hour:
          type: number
        sched0Slot1Min:
          type: number
        sched0Slot1On:
          type: boolean
        sched1Slot1Hour:
          type: number
        sched1Slot1Min:
          type: number
        sched1Slot1On:
          type: boolean
        sched2Slot1Hour:
          type: number
        sched2Slot1Min:
          type: number
        sched2Slot1On:
          type: boolean
        sched3Slot1Hour:
          type: number
        sched3Slot1Min:
          type: number
        sched3Slot1On:
          type: boolean
        sched4Slot1Hour:
          type: number
        sched4Slot1Min:
          type: number
        sched4Slot1On:
          type: boolean
        sched5Slot1Hour:
          type: number
        sched5Slot1Min:
          type: number
        sched5Slot1On:
          type: boolean
        sched6Slot1Hour:
          type: number
        sched6Slot1Min:
